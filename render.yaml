# Render Blueprint for the API + Postgres (the frontend goes on Vercel, see README).
# Not verified against a live Render account.
services:
  - type: web
    name: parallel-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parallel-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: SEED_DATA
        value: "true"

databases:
  - name: parallel-db
    plan: free
